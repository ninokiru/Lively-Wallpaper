name: Build

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  RID: win-x64
  # Every project is published here first; the three trees are then merged into PUBLISH_DIR.
  STAGE_DIR: ${{ github.workspace }}\stage
  PUBLISH_DIR: ${{ github.workspace }}\publish

jobs:
  build:
    name: Publish x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      # The in-app updater compares the installed assembly version against the newest
      # release tag: a tagged build that kept the version committed in the csproj would
      # offer the very same update forever. Stamped once here, read by every publish.
      - name: Resolve build version
        shell: pwsh
        run: |
          $version = '0.0.1.0'
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $raw = ($env:GITHUB_REF_NAME -replace '^v', '') -replace '-.*$', ''
            $parts = @($raw.Split('.') | Where-Object { $_ -match '^\d+$' })
            if ($parts.Count -ge 1) {
              while ($parts.Count -lt 4) { $parts += '0' }
              # AssemblyVersion fields are 16 bit, a bigger part would fail the compile.
              $limited = @($parts[0..3] | ForEach-Object { [Math]::Min([int]$_, 65535) })
              $version = ($limited -join '.')
            }
          }
          Write-Host "Assembly version: $version"
          Add-Content -Path $env:GITHUB_ENV -Value "LIVELY_VERSION=$version"

      # Everything comes from NuGet restore; no binaries are committed or fetched by hand.
      #
      # Core, UI and player are three separate processes, so each used to ship its own full
      # copy of the .NET runtime, of ImageMagick and of the shared libraries - roughly 200 MB
      # of duplicate files in a 666 MB install. They are staged one folder per project, then
      # merged into a single tree that all three run from. The app resolves both executables
      # relative to the core folder, so the lookup paths live in Constants.PlayerPartialPaths
      # and RunnerService.
      - name: Publish core
        run: >
          dotnet publish src/Lively/Lively/Lively.csproj
          -c Release -r $env:RID --self-contained true
          -p:DebugType=none -p:DebugSymbols=false
          -p:LivelyVersion=$env:LIVELY_VERSION
          -o "$env:STAGE_DIR\core"

      - name: Publish UI
        run: >
          dotnet publish src/Lively/Lively.UI.WinUI/Lively.UI.WinUI.csproj
          -c Release -r $env:RID --self-contained true
          -p:DebugType=none -p:DebugSymbols=false
          -p:LivelyVersion=$env:LIVELY_VERSION
          -o "$env:STAGE_DIR\ui"

      - name: Publish WebView2 player
        run: >
          dotnet publish src/Lively/Lively.Player.WebView2/Lively.Player.WebView2.csproj
          -c Release -r $env:RID --self-contained true
          -p:DebugType=none -p:DebugSymbols=false
          -p:LivelyVersion=$env:LIVELY_VERSION
          -o "$env:STAGE_DIR\player"

      - name: Merge staged output into one shared tree
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          # Managed assemblies answer with their assembly version, native dll files with the
          # file version in their resource block. Keeping the newest copy matters: a process
          # may load an assembly newer than the one it compiled against, an older one can
          # throw MissingMethodException at run time.
          function Get-AssemblyVersion([string]$File) {
            try { return [System.Reflection.AssemblyName]::GetAssemblyName($File).Version } catch { }
            $info = [System.Diagnostics.FileVersionInfo]::GetVersionInfo($File)
            $text = ''
            if ($info -and $info.FileVersion) { $text = ($info.FileVersion -split '\s')[0] }
            $parsed = [Version]$null
            if ([Version]::TryParse($text, [ref]$parsed)) { return $parsed }
            return $null
          }

          New-Item -ItemType Directory -Force -Path $env:PUBLISH_DIR | Out-Null
          $count = @{ new = 0; identical = 0; replaced = 0; kept = 0 }
          foreach ($stage in 'core', 'player', 'ui') {
            $root = (Resolve-Path -LiteralPath (Join-Path $env:STAGE_DIR $stage)).Path
            Get-ChildItem -LiteralPath $root -Recurse -File | ForEach-Object {
              $relative = [System.IO.Path]::GetRelativePath($root, $_.FullName)
              $target = Join-Path $env:PUBLISH_DIR $relative
              if (-not (Test-Path -LiteralPath $target)) {
                New-Item -ItemType Directory -Force -Path (Split-Path -Parent $target) | Out-Null
                Copy-Item -LiteralPath $_.FullName -Destination $target
                $count.new = $count.new + 1
                return
              }
              $sourceHash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash
              $targetHash = (Get-FileHash -LiteralPath $target -Algorithm SHA256).Hash
              if ($sourceHash -eq $targetHash) {
                $count.identical = $count.identical + 1
                return
              }
              $incoming = Get-AssemblyVersion $_.FullName
              $existing = Get-AssemblyVersion $target
              # Newest wins; an equal or unreadable version goes to the later stage, which is
              # why the UI is merged last - it is built against the highest Windows SDK and
              # the newest WinAppSDK, so its copy of a tied file covers the other two.
              if ((-not $incoming) -or (-not $existing) -or ($incoming -ge $existing)) {
                Copy-Item -LiteralPath $_.FullName -Destination $target -Force
                $count.replaced = $count.replaced + 1
                Write-Host "Replaced $relative ($existing) with $incoming from $stage."
              } else {
                $count.kept = $count.kept + 1
                Write-Host "Kept $relative ($existing), $stage offered the older $incoming."
              }
            }
          }
          $summary = "Merge summary: {0} new, {1} identical, {2} replaced, {3} kept." -f $count.new, $count.identical, $count.replaced, $count.kept
          Write-Host $summary
          if ($count.kept -gt 0) {
            # A file was left in place because the copy already merged was newer. Nothing is
            # broken by this, but it is where a version mismatch would hide, so list them.
            Write-Host "::warning::$($count.kept) colliding file(s) kept a newer version than another process was built against."
          }
          Remove-Item -LiteralPath $env:STAGE_DIR -Recurse -Force

      # The app looks these up by relative path at runtime, so fail the build if staging is wrong.
      - name: Verify layout
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $expected = @(
            "$env:PUBLISH_DIR\Lively.exe",
            "$env:PUBLISH_DIR\Lively.UI.WinUI.exe",
            "$env:PUBLISH_DIR\Lively.Player.WebView2.exe",
            "$env:PUBLISH_DIR\Assets\Plugins\Media\LivelyProperties.json"
          )
          $missing = $expected | Where-Object { -not (Test-Path -LiteralPath $_) }
          if ($missing) {
            $missing | ForEach-Object { Write-Host "::error::Missing $_" }
            exit 1
          }

          # Merging is only safe if every assembly an app declares in its deps.json really
          # landed in the shared folder; a missing one fails at run time, not at start up.
          $paths = [System.Collections.Generic.HashSet[string]]::new([System.StringComparer]::OrdinalIgnoreCase)
          $leaves = [System.Collections.Generic.HashSet[string]]::new([System.StringComparer]::OrdinalIgnoreCase)
          Get-ChildItem -LiteralPath $env:PUBLISH_DIR -Recurse -File | ForEach-Object {
            [void]$paths.Add($_.FullName.Substring($env:PUBLISH_DIR.Length + 1))
            [void]$leaves.Add($_.Name)
          }
          foreach ($app in 'Lively', 'Lively.UI.WinUI', 'Lively.Player.WebView2') {
            $deps = Get-Content -LiteralPath (Join-Path $env:PUBLISH_DIR "$app.deps.json") -Raw | ConvertFrom-Json
            $assets = foreach ($target in $deps.targets.PSObject.Properties) {
              foreach ($library in $target.Value.PSObject.Properties) {
                foreach ($group in 'runtime', 'native', 'resources') {
                  if ($library.Value.$group) { $library.Value.$group.PSObject.Properties.Name }
                }
              }
            }
            foreach ($asset in ($assets | Sort-Object -Unique)) {
              # deps.json writes forward slashes while the file system uses backslashes, so
              # only the file name is compared against the merged tree.
              $leaf = ($asset -split '[\\/]')[-1]
              if (-not $paths.Contains($asset) -and -not $leaves.Contains($leaf)) {
                Write-Host "::error::$app.deps.json needs '$asset' but the merged tree has no such file."
                exit 1
              }
            }
          }

          # Removed engine binaries, matched by name prefix so unrelated dll files
          # such as wuceffectsi.dll are not caught.
          $leftovers = Get-ChildItem -LiteralPath $env:PUBLISH_DIR -Recurse -Include *.dll, *.exe |
            Where-Object { $_.Name -match '^(CefSharp|libcef|libvlc|vlc|libmpv|mpv-)' }
          if ($leftovers) {
            $leftovers | ForEach-Object { Write-Host "::error::Removed player leftover: $($_.FullName)" }
            exit 1
          }

      # Where the weight actually sits, so a future reduction can be measured instead of
      # guessed at. Prints the total, the per top level folder totals and the largest files.
      - name: Report publish size
        shell: pwsh
        run: |
          $files = Get-ChildItem -LiteralPath $env:PUBLISH_DIR -Recurse -File
          $total = ($files | Measure-Object -Property Length -Sum).Sum
          Write-Host ('Installed size: {0:N1} MB in {1} files.' -f ($total / 1MB), $files.Count)
          foreach ($child in Get-ChildItem -LiteralPath $env:PUBLISH_DIR -Directory) {
            $size = (Get-ChildItem -LiteralPath $child.FullName -Recurse -File | Measure-Object -Property Length -Sum).Sum
            Write-Host ('   {0,9:N1} MB  folder {1}' -f ($size / 1MB), $child.Name)
          }
          $files | Sort-Object -Property Length -Descending | Select-Object -First 20 | ForEach-Object {
            $name = $_.FullName.Substring($env:PUBLISH_DIR.Length + 1)
            Write-Host ('   {0,9:N1} MB  {1}' -f ($_.Length / 1MB), $name)
          }

      - uses: actions/upload-artifact@v4
        with:
          name: luma-win-x64-portable
          # Glob so the artifact stores the publish contents, not a "publish" folder.
          path: ${{ env.PUBLISH_DIR }}\**
          if-no-files-found: error

  installer:
    name: Inno Setup installer
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: luma-win-x64-portable
          path: src/installer/Release

      - name: Flatten artifact
        shell: pwsh
        run: |
          # Script_x64.iss reads Release\* directly, so the publish tree must sit right there.
          $nested = Join-Path "src/installer/Release" "publish"
          if (Test-Path -LiteralPath $nested) {
            Get-ChildItem -LiteralPath $nested | Move-Item -Destination "src/installer/Release"
            Remove-Item -LiteralPath $nested
          }

      - name: Install Inno Setup
        shell: pwsh
        run: |
          # jrsoftware.org serves whatever major version is current, so locate the compiler
          # by folder name instead of assuming "Inno Setup 6".
          function Find-Iscc {
            Get-ChildItem -Path "${env:ProgramFiles(x86)}", $env:ProgramFiles -Directory -Filter "Inno Setup*" -ErrorAction SilentlyContinue |
              ForEach-Object { Join-Path $_.FullName "ISCC.exe" } |
              Where-Object { Test-Path -LiteralPath $_ } |
              Select-Object -First 1
          }
          $iscc = Find-Iscc
          if (-not $iscc) {
            $setup = Join-Path $env:RUNNER_TEMP "innosetup.exe"
            Invoke-WebRequest -Uri "https://jrsoftware.org/download.php/is.exe" -OutFile $setup
            Start-Process -FilePath $setup -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -Wait
            $iscc = Find-Iscc
          }
          if (-not $iscc) {
            Write-Host "::error::ISCC.exe not found after installing Inno Setup."
            exit 1
          }
          Write-Host "Using compiler: $iscc"
          Add-Content -Path $env:GITHUB_ENV -Value "ISCC_PATH=$iscc"

      # Ships the C++ runtime that Magick.NET and the WebView2 SDK need; the .NET runtime
      # is not bundled because the publish output above is self-contained.
      - name: Stage Visual C++ redistributable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path src/installer/VC | Out-Null
          Invoke-WebRequest -Uri "https://aka.ms/vs/17/release/vc_redist.x64.exe" -OutFile src/installer/VC/VC_redist.x64.exe

      - name: Compile installer
        working-directory: src/installer
        shell: pwsh
        run: |
          # Tagged builds override the version in the script, so the asset the updater
          # downloads (luma_setup_x64_full_v<tag>.exe) matches the release it came from.
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $version = $env:GITHUB_REF_NAME -replace '^v', ''
            & $env:ISCC_PATH "/DMyAppVersion=$version" Script_x64.iss
          }
          else {
            & $env:ISCC_PATH Script_x64.iss
          }

      - uses: actions/upload-artifact@v4
        with:
          name: luma-win-x64-installer
          path: src/installer/Output/*.exe
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # GitHub Release: the only channel the in-app updater reads.
  #
  # How the tag relates to AssemblyVersion:
  #   The build job stamps LivelyVersion from the tag, so the installed app reports the
  #   same version it was released as. GithubUtil.GetVersion() strips every non-digit and
  #   non-dot from TagName and parses the rest as System.Version, then
  #   CompareAssemblyVersion() pads both sides to four parts before comparing against the
  #   entry assembly version. So v0.0.2 is an update over an installed 0.0.1, v0.0.1 is up
  #   to date and v0.0.2-beta is read as 0.0.2.
  #   The --prerelease flag below only decorates GitHub; the updater takes the
  #   newest release whatever its channel, so publish a beta tag only when the
  #   build really is newer.
  #
  # Asset the updater matches on: any asset whose name contains
  # luma_setup_x64_full, which is what Script_x64.iss produces.
  # ---------------------------------------------------------------------------
  release:
    name: GitHub Release
    needs: [build, installer]
    runs-on: ubuntu-latest
    # Tags publish, branch pushes and pull_request builds never do. success() is
    # spelled out because a custom if replaces the implicit "all needs succeeded"
    # guard and would otherwise release half-built files.
    if: startsWith(github.ref, 'refs/tags/v') && success()
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The notes diff the previous tag against this one, so the default
          # single-commit checkout is not enough.
          fetch-depth: 0

      # Both artifacts land in dist/, but the portable one was uploaded with a "**"
      # glob: its archive root IS the publish tree, so restoring it straight into
      # dist/ would scatter thousands of loose files and directories there and the
      # dist/* asset glob would upload all of them. It is restored beside dist/ and
      # archived, which keeps dist/ down to exactly two release assets.
      - name: Download installer
        uses: actions/download-artifact@v4
        with:
          name: luma-win-x64-installer
          path: dist

      - name: Download portable build
        uses: actions/download-artifact@v4
        with:
          name: luma-win-x64-portable
          path: portable

      - name: Stage release assets
        run: |
          set -euo pipefail
          command -v zip >/dev/null || { echo "::error::zip is missing from the runner image."; exit 1; }
          folder="luma-win-x64-portable-${GITHUB_REF_NAME}"
          mv portable "${folder}"
          zip -qr "dist/${folder}.zip" "${folder}"
          ls -l dist
          files=$(find dist -maxdepth 1 -type f | wc -l)
          if [ "${files}" -ne 2 ]; then
            echo "::error::Expected two release assets in dist/, found ${files}. Check the publish steps."
            exit 1
          fi

      - name: Build release notes
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          # Nearest tag on the tagged commit's ancestry; empty for the first release,
          # where the whole log is used instead.
          PREV_TAG="$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)"

          {
            echo "## ${TAG}"
            echo
            if [ -n "${PREV_TAG}" ]; then
              echo "Changes since \`${PREV_TAG}\`:"
              echo
              # Merged PRs first; the compare endpoint links them to this tag range.
              merged="$(gh api "repos/${GITHUB_REPOSITORY}/compare/${PREV_TAG}...${TAG}" \
                --jq '.pull_requests[]? | "[#" + (.number | tostring) + "](" + .html_url + ") " + .title' || true)"
              if [ -n "${merged}" ]; then
                printf '%s\n' "${merged}"
              else
                # Nothing linked: fall back to the commit subjects.
                git log --no-merges --pretty=format:'- %s (%h)' "${PREV_TAG}..${TAG}"
                echo
              fi
            else
              echo "First tagged build - commit log:"
              echo
              git log --no-merges --pretty=format:'- %s (%h)' "${TAG}"
              echo
            fi
            echo
            echo "## Files"
            echo
            for asset in dist/*; do
              name="$(basename "${asset}")"
              case "${name}" in
                *.exe) echo "- \`${name}\` - installer, bundles the Visual C++ runtime." ;;
                *.zip) echo "- \`${name}\` - portable build, extract anywhere and run Lively.exe." ;;
                *) echo "- \`${name}\`" ;;
              esac
            done
            echo
            echo "Built from the \`${TAG}\` tag by the Build workflow."
          } > release-notes.md

          cat release-notes.md

      - name: Publish release
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          TITLE="Luma Wallpaper ${TAG}"
          # v0.0.2-beta and similar suffixed tags are prereleases, plain ones are not.
          FLAGS=()
          case "${TAG}" in
            *-*) FLAGS+=(--prerelease) ;;
          esac

          if gh release view "${TAG}" >/dev/null 2>&1; then
            # Re-running a tag must not hard fail: rewrite the notes in place and
            # overwrite the assets instead of creating a duplicate release.
            gh release edit "${TAG}" --title "${TITLE}" --notes-file release-notes.md "${FLAGS[@]}"
            gh release upload "${TAG}" dist/* --clobber
          else
            gh release create "${TAG}" \
              --title "${TITLE}" \
              --notes-file release-notes.md \
              --verify-tag \
              "${FLAGS[@]}" \
              dist/*
          fi

          # Log where the release landed; never fail the job over this cosmetic call.
          gh release view "${TAG}" || true
