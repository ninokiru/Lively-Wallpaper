name: Build

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  RID: win-x64
  PUBLISH_DIR: ${{ github.workspace }}\publish

jobs:
  build:
    name: Publish x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      # Everything comes from NuGet restore; no binaries are committed or fetched by hand.
      - name: Publish core
        run: >
          dotnet publish src/Lively/Lively/Lively.csproj
          -c Release -r $env:RID --self-contained true
          -p:DebugType=none -p:DebugSymbols=false
          -o "$env:PUBLISH_DIR"

      - name: Publish UI
        run: >
          dotnet publish src/Lively/Lively.UI.WinUI/Lively.UI.WinUI.csproj
          -c Release -r $env:RID --self-contained true
          -p:DebugType=none -p:DebugSymbols=false
          -o "$env:PUBLISH_DIR\plugins\UI"

      - name: Publish WebView2 player
        run: >
          dotnet publish src/Lively/Lively.Player.WebView2/Lively.Player.WebView2.csproj
          -c Release -r $env:RID --self-contained true
          -p:DebugType=none -p:DebugSymbols=false
          -o "$env:PUBLISH_DIR\plugins\webview2"

      # The app looks these up by relative path at runtime, so fail the build if staging is wrong.
      - name: Verify layout
        shell: pwsh
        run: |
          $expected = @(
            "$env:PUBLISH_DIR\Lively.exe",
            "$env:PUBLISH_DIR\plugins\UI\Lively.UI.WinUI.exe",
            "$env:PUBLISH_DIR\plugins\webview2\Lively.Player.WebView2.exe",
            "$env:PUBLISH_DIR\Assets\Plugins\Media\LivelyProperties.json"
          )
          $missing = $expected | Where-Object { -not (Test-Path -LiteralPath $_) }
          if ($missing) {
            $missing | ForEach-Object { Write-Host "::error::Missing $_" }
            exit 1
          }
          # Removed engine binaries, matched by name prefix so unrelated dll files
          # such as wuceffectsi.dll are not caught.
          $leftovers = Get-ChildItem -LiteralPath $env:PUBLISH_DIR -Recurse -Include *.dll, *.exe |
            Where-Object { $_.Name -match '^(CefSharp|libcef|libvlc|vlc|libmpv|mpv-)' }
          if ($leftovers) {
            $leftovers | ForEach-Object { Write-Host "::error::Removed player leftover: $($_.FullName)" }
            exit 1
          }

      - uses: actions/upload-artifact@v4
        with:
          name: lively-win-x64-portable
          # Glob so the artifact stores the publish contents, not a "publish" folder.
          path: ${{ env.PUBLISH_DIR }}\**
          if-no-files-found: error

  installer:
    name: Inno Setup installer
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: lively-win-x64-portable
          path: src/installer/Release

      - name: Flatten artifact
        shell: pwsh
        run: |
          # Script_x64.iss reads Release\* directly, so the publish tree must sit right there.
          $nested = Join-Path "src/installer/Release" "publish"
          if (Test-Path -LiteralPath $nested) {
            Get-ChildItem -LiteralPath $nested | Move-Item -Destination "src/installer/Release"
            Remove-Item -LiteralPath $nested
          }

      - name: Install Inno Setup
        shell: pwsh
        run: |
          # jrsoftware.org serves whatever major version is current, so locate the compiler
          # by folder name instead of assuming "Inno Setup 6".
          function Find-Iscc {
            Get-ChildItem -Path "${env:ProgramFiles(x86)}", $env:ProgramFiles -Directory -Filter "Inno Setup*" -ErrorAction SilentlyContinue |
              ForEach-Object { Join-Path $_.FullName "ISCC.exe" } |
              Where-Object { Test-Path -LiteralPath $_ } |
              Select-Object -First 1
          }
          $iscc = Find-Iscc
          if (-not $iscc) {
            $setup = Join-Path $env:RUNNER_TEMP "innosetup.exe"
            Invoke-WebRequest -Uri "https://jrsoftware.org/download.php/is.exe" -OutFile $setup
            Start-Process -FilePath $setup -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -Wait
            $iscc = Find-Iscc
          }
          if (-not $iscc) {
            Write-Host "::error::ISCC.exe not found after installing Inno Setup."
            exit 1
          }
          Write-Host "Using compiler: $iscc"
          Add-Content -Path $env:GITHUB_ENV -Value "ISCC_PATH=$iscc"

      # Ships the C++ runtime that Magick.NET and the WebView2 SDK need; the .NET runtime
      # is not bundled because the publish output above is self-contained.
      - name: Stage Visual C++ redistributable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path src/installer/VC | Out-Null
          Invoke-WebRequest -Uri "https://aka.ms/vs/17/release/vc_redist.x64.exe" -OutFile src/installer/VC/VC_redist.x64.exe

      - name: Compile installer
        working-directory: src/installer
        shell: pwsh
        run: |
          & $env:ISCC_PATH Script_x64.iss

      - uses: actions/upload-artifact@v4
        with:
          name: lively-win-x64-installer
          path: src/installer/Output/*.exe
          if-no-files-found: error
